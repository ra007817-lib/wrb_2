<script>
    const valor_conta = prompt("Digite o valor da conta das pizzas: ");
    const numero_pessoas = prompt("Digite o número de pessoas: ");
    const valor_por_pessoa = Number(valor_conta) / Number(numero_pessoas);
    alert(`O valor da conta é: R$ ${valor_conta}\nO número de pessoas é: ${numero_pessoas}\nO valor por pessoa é: R$ ${valor_por_pessoa.toFixed(2)}`);
</script>
