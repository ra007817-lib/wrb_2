<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Programa Números Perfeitos</title>
</head>
<body>
    <div class="container">
        <div class="row pt-5">
            <div class="col-md-4">
                <img src="img/exerc.jpg" alt="Programa Números Perfeitos" class="img-fluid">
            </div>
            
            <div class="col-md-8">
                <h2 class="border-bottom pb-2 mb-4">Programa Números Perfeitos</h2>
                
                <form>
                    <p>
                        Número:
                        <input type="number" id="inNumero" min="1" required>
                    </p>
                    <button type="submit" class="btn btn-primary">
                        Verificar Se É Perfeito
                    </button>
                </form>

                <h5 id="outResp1" class="mt-4 fw-bold font-weight-bold"></h5>
                <h5 id="outResp2" class="fw-bold font-weight-bold"></h5>
            </div>
        </div>
    </div>

    <script src="js/ex03.js"></script>
</body>
</html>
