<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Supermercado JS</title>
</head>

<body>

    <div class="container">
        <div class="row text-center pt-5">
            <div class="col">

                <h1>Supermercado JS</h1>

                <form>

                    <p>
                        Produto:
                        <input type="text" id="inProduto" required>
                    </p>

                    <p>
                        Preço R$:
                        <input type="number" id="inPreco" step="0.01" required>
                    </p>

                    <input type="submit" value="Ver Promoção" class="btn btn-warning">

                </form>

                <h3></h3>

                <script src="js/ex03.js"></script>
            </div>
        </div>
    </div>

</body>

</html>
