<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Programa Parquímetro</title>
</head>
<body>
    <div class="container">
        <div class="row pt-5">
            
            <div class="col-md-4">
                <img src="img/exerc.jpg" alt="Imagem do programa" class="img-fluid">
            </div>
            
            <div class="col-md-8">
                <h2 class="border-bottom pb-2 mb-4">Programa Parquímetro</h2>
                
                <form>
                    <p>Valor R$:
                        <input type="number" id="inValor" step="0.01" min="0" required>
                    </p>
                    <input type="submit" value="Confirmar Depósito">
                </form>
                
                <h5 id="outTempo" class="mt-4 fw-bold font-weight-bold"></h5>
                <h5 id="outTroco" class="fw-bold font-weight-bold"></h5>
            </div>
        </div>
    </div>
    <script src="js/ex03.js"></script>
</body>
</html>
